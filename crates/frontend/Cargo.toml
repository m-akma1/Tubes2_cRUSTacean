[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos                   = { workspace = true }
wasm-bindgen             = { workspace = true }
console_error_panic_hook = { workspace = true }
gloo-timers              = { workspace = true }
serde_json               = { workspace = true }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"  # removes panic unwinding machinery from WASM