services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "2026:80"
    environment:
      RUST_LOG: "info"
      PORT: "80"
      APP_ENV: "production"
      CORS_ALLOWED_ORIGINS: "http://localhost"
    restart: unless-stopped
